name: Trigger auto deployment for aios-runtime

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/aios-runtime-AutoDeployTrigger-e27f8fb8-1f56-4d74-ab1a-8ab2f82f4791.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "scripts/social-publishing-worker.ts"
      - "scripts/azure/render-social-publishing-worker.mjs"
      - "src/lib/social-publishing/**"
      - "supabase/migrations/20260721000000_youtube_resumable_uploads.sql"
      - ".github/workflows/aios-runtime-AutoDeployTrigger-e27f8fb8-1f56-4d74-ab1a-8ab2f82f4791.yml"
  workflow_dispatch:

jobs:
  docker-pr-validation:
    name: Docker PR Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build --target runner -t aios-runtime:pr-${{ github.sha }} .
          docker build --target worker -t aios-social-worker:pr-${{ github.sha }} .

      - name: Verify runtime assets in image
        run: |
          docker run --rm \
            --entrypoint sh \
            aios-runtime:pr-${{ github.sha }} \
            -c 'test -f /app/server.js && test -d /app/.next/static && test -d /app/public'

      - name: Start container
        run: |
          docker run -d \
            --name aios-runtime-pr-test \
            -p 3000:3000 \
            aios-runtime:pr-${{ github.sha }}

      - name: Wait for startup and verify HTTP response
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/aca-pr-response.html; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "Container failed HTTP readiness check on port 3000"
            docker logs aios-runtime-pr-test || true
            exit 1
          fi
          test -s /tmp/aca-pr-response.html

      - name: Verify disabled worker health and readiness
        run: |
          docker run -d \
            --name aios-social-worker-pr-test \
            -e AIOS_SOCIAL_PUBLISHING_WORKER_ENABLED=false \
            -p 18081:8081 \
            aios-social-worker:pr-${{ github.sha }}
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/healthz >/tmp/social-worker-health.json \
              && curl -fsS http://127.0.0.1:18081/readyz >/tmp/social-worker-ready.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          grep -q '"mode":"disabled"' /tmp/social-worker-ready.json

      - name: Cleanup test container
        if: always()
        run: |
          docker logs aios-runtime-pr-test || true
          docker rm -f aios-runtime-pr-test || true
          docker logs aios-social-worker-pr-test || true
          docker rm -f aios-social-worker-pr-test || true

  build-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      CONTAINER_APP_NAME: aios-runtime
      RESOURCE_GROUP: aios-core-rg
      ACR_NAME: aioscoreacr
      IMAGE_NAME: aios-runtime
      IMAGE_TAG: ${{ github.sha }}
      WORKER_IMAGE_SUFFIX: social-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIOSRUNTIME_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIOSRUNTIME_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIOSRUNTIME_AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR login server
        run: |
          REGISTRY_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)
          test -n "$REGISTRY_LOGIN_SERVER"
          echo "REGISTRY_LOGIN_SERVER=$REGISTRY_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker images
        run: |
          test -n "$REGISTRY_LOGIN_SERVER"
          docker build --target runner -t "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" .
          docker build --target worker -t "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG-$WORKER_IMAGE_SUFFIX" .
          docker push "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG-$WORKER_IMAGE_SUFFIX"

      - name: Configure Container App registry with managed identity
        run: |
          test -n "$REGISTRY_LOGIN_SERVER"
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$REGISTRY_LOGIN_SERVER" \
            --identity system

      - name: Render Azure Container Apps web and worker template
        run: |
          umask 077
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.template \
            --output json > "$RUNNER_TEMP/current-template.json"
          node scripts/azure/render-social-publishing-worker.mjs \
            "$RUNNER_TEMP/current-template.json" \
            "$RUNNER_TEMP/next-template.json" \
            "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" \
            "$REGISTRY_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG-$WORKER_IMAGE_SUFFIX" \
            "$CONTAINER_APP_NAME"

      - name: Deploy to Azure Container Apps
        run: |
          test -n "$REGISTRY_LOGIN_SERVER"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --yaml "$RUNNER_TEMP/next-template.json"
          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --type external \
            --target-port 3000 \
            --transport auto
